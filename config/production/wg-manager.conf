[manager]
interface = wg0
state_file = /var/lib/wg-manager/controller/peers.json

[tls]
server_cert = /etc/wg-manager/cert/controller/server.crt
server_key = /etc/wg-manager/cert/controller/server.key
client_ca = /etc/wg-manager/cert/ca.crt

[policy]
vpn_network = 10.20.0.0/24
# Address assigned to the WireGuard server itself. Use a host prefix so it is
# treated as one occupied address during provisioning.
server_address = 10.20.0.1/32
